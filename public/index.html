<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماد — مدیریت اسکان دانشجویی</title>
<meta name="theme-color" content="#14202e">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--bg:#eef3fa;--card:#fff;--ink:#1b2735;--mut:#6a778a;--line:#e5ecf5;--pri:#1e6fd9;--pri-d:#1858ae;--ok:#12805c;--bad:#c0392b;--warn:#b7791f;--sh:0 8px 26px rgba(15,40,90,.08)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,#e3edfa 0,var(--bg) 360px) fixed;color:var(--ink);font:14px/1.75 "Segoe UI",Tahoma,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;color:#fff;background:radial-gradient(700px 200px at 90% -40%,#2f7de0 0,transparent 70%),linear-gradient(135deg,#0e2a55,#12202f);box-shadow:0 6px 22px rgba(10,25,60,.28)}
header h1{font-size:18px;margin:0;flex:none;letter-spacing:.3px}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.logo{display:inline-block;line-height:0;flex:none}.logo svg{width:100%;height:100%}
header .who{font-size:12.5px;opacity:.85}
.shell{display:flex;gap:16px;padding:16px 20px;align-items:flex-start;max-width:1500px;margin:0 auto}
nav{flex:0 0 206px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;position:sticky;top:12px;box-shadow:var(--sh)}
nav button{display:block;width:100%;text-align:right;background:none;border:0;padding:8px 12px;margin:1px 0;border-radius:10px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;transition:background .15s}
nav button:hover{background:#eef4fc}
nav button.on{background:linear-gradient(135deg,#3b8cf0,#1858ae);color:#fff;box-shadow:0 6px 14px rgba(30,111,217,.3)}
main{flex:1;min-width:0;animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2,.card h3{margin:0 0 10px;font-size:15px}
.card h3{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.stat{background:linear-gradient(135deg,#f1f7ff,#fff);border:1px solid #dfeaf8;border-radius:14px;padding:11px 14px}
.stat b{display:block;font-size:22px;line-height:1.5;background:linear-gradient(135deg,#2f7de0,#1858ae);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--mut);font-size:12.5px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 12px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mut)}
.form label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input,select,textarea{font:inherit;font-size:14px;padding:0 12px;height:40px;border:1.5px solid #e1e8f1;border-radius:11px;background:#f6f9fd;color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s,background .15s}
textarea{height:auto;padding:9px 12px}
input[type=checkbox]{width:auto;height:auto;accent-color:var(--pri)}

.btn{font:inherit;font-size:13.5px;font-weight:600;border:0;color:#fff;padding:0 16px;height:38px;border-radius:11px;cursor:pointer;background:linear-gradient(135deg,#3b8cf0,#1858ae);box-shadow:0 6px 14px rgba(30,111,217,.26);transition:transform .12s,box-shadow .12s,filter .12s}

.btn:active{transform:none}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px;border-radius:9px;box-shadow:0 4px 10px rgba(30,111,217,.22)}
.btn.ghost{background:#e9f0f9;color:var(--ink);box-shadow:none}.btn.ghost:hover{background:#dde8f5;box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#25ab80,#12805c);box-shadow:0 6px 14px rgba(18,128,92,.26)}
.btn.bad{background:linear-gradient(135deg,#e5655a,#c0392b);box-shadow:0 6px 14px rgba(192,57,43,.26)}
.btn.warn{background:linear-gradient(135deg,#e0a33a,#b7791f);box-shadow:0 6px 14px rgba(183,121,31,.26)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{background:#f2f6fc;color:var(--mut);font-weight:600;font-size:12px}
tbody tr:hover td{background:#f8fbff}
td .btn{margin:2px 0 2px 4px}
td.actions{white-space:normal;min-width:230px}
.tag{display:inline-block;padding:0 9px;border-radius:999px;font-size:12px;line-height:22px;background:#e8eef6;color:#43526a}
.tag.ok{background:#daf3e9;color:var(--ok)}.tag.bad{background:#fde3df;color:var(--bad)}.tag.warn{background:#fdf0d3;color:var(--warn)}
.muted{color:var(--mut)}
p{margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex}
.seg button{border:1.5px solid #d5deea;background:#fff;padding:5px 13px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);margin-right:-1.5px}
.seg button:first-child{border-radius:0 9px 9px 0;margin-right:0}.seg button:last-child{border-radius:9px 0 0 9px}
.seg button.on.PRESENT{background:linear-gradient(135deg,#25ab80,#12805c);color:#fff;border-color:var(--ok)}
.seg button.on.ABSENT{background:linear-gradient(135deg,#e5655a,#c0392b);color:#fff;border-color:var(--bad)}

.seg.big button{padding:8px 14px;font-size:14px;min-width:62px}

.overlay{position:fixed;inset:0;background:rgba(8,18,36,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .2s ease both}

.modal>.btn.ghost{margin-top:10px;width:100%}

.lf .eye:hover{color:var(--pri);transform:translateY(-50%)}.lf .eye svg{width:18px;height:18px}
.login-btn{width:100%;height:48px;margin-top:4px;font:inherit;font-size:16px;font-weight:700;border:0;border-radius:14px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#3b8cf0,#1858ae);box-shadow:0 10px 22px rgba(30,111,217,.38);transition:transform .15s,box-shadow .15s}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(30,111,217,.46)}
.login-btn:disabled{opacity:.75;cursor:wait;transform:none}
.login-err{background:#fdecea;color:#b3261e;border-radius:12px;padding:9px 13px;margin:0 0 12px;font-size:13px;text-align:right;line-height:1.8}
.login-foot{margin-top:18px;color:#98a4b3;font-size:12px;line-height:1.9}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-left:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{max-width:660px}
.modal .form{grid-template-columns:repeat(2,1fr)}
.modal .form label:has(textarea),.modal .form label.chk,.modal .form>div:last-child{grid-column:1/-1}
@media(max-width:800px){
  .shell{flex-direction:column;padding:12px;gap:12px}

  nav button{width:auto;flex:none;white-space:nowrap;margin:0}
  header{padding:10px 14px}.brand .who{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}
  .form,.modal .form{grid-template-columns:1fr}
  .stat b{font-size:20px}
}
</style>
</head>

<script>
"use strict";
/* ---------- tiny helpers ---------- */
const h = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
};
const toast = (msg, type = "ok") => {

/* ---------- API ---------- */
let token = localStorage.getItem("mad_token");
let me = null;
/* ---------- API + offline layer ---------- */
class NetError extends Error {}
const uid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 14));

async function rawFetch(method, path, body, idemKey) {
  let res;
  try {
    res = await fetch("/api" + path, {
      method,
      headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}), ...(idemKey ? { "Idempotency-Key": idemKey } : {}) },
      body: body === undefined ? undefined : JSON.stringify(body),
    });

  let data = null;
  try { data = await res.json(); } catch { /* empty body */ }
  if (!res.ok) {
    const m = data && data.message;
    const err = new Error(Array.isArray(m) ? m.join(" | ") : m || "خطا " + res.status);
    err.status = res.status;
    throw err;
  }
  return data;
}

/* IndexedDB: "kv" = cached GET responses per user, "outbox" = changes waiting to be sent */
const DB = {
  _db: null,
  open() {
    if (!this._db) this._db = new Promise((res, rej) => {
      const r = indexedDB.open("mad", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("outbox", { keyPath: "id" }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async tx(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && "result" in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  get(k) { return this.tx("kv", "readonly", (s) => s.get(k)); },
  set(k, v) { return this.tx("kv", "readwrite", (s) => { s.put(v, k); }); },
  all(store) { return this.tx(store, "readonly", (s) => s.getAll()); },
  put(item) { return this.tx("outbox", "readwrite", (s) => { s.put(item); }); },
  del(id) { return this.tx("outbox", "readwrite", (s) => { s.delete(id); }); },
};
const ckey = (path) => (me ? me.id : "-") + ":" + path;
const putCache = (path, value) => (me ? DB.set(ckey(path), value).catch(() => {}) : Promise.resolve());
async function patchCache(path, fn) {
  if (!me) return;
  try { const c = await DB.get(ckey(path)); if (c !== undefined && c !== null) await DB.set(ckey(path), fn(c)); } catch { /* ignore */ }
}

let offline = false;
const setOffline = (v) => { if (offline !== v) { offline = v; updateStatus(); } };

/* GET: network first, falls back to the last copy saved on this device */
async function api(method, path, body) {
  if (method === "GET") {
    try {
      const data = await rawFetch("GET", path);
      setOffline(false);
      if (me && !path.startsWith("/auth/")) putCache(path, data);
      return data;
    } catch (e) {
      if (e instanceof NetError) {
        const cached = me ? await DB.get(ckey(path)).catch(() => undefined) : undefined;
        setOffline(true);
        if (cached !== undefined) return cached;
      } else if (e.status === 401 && token) logout();
      throw e;
    }
  }
  try { const d = await rawFetch(method, path, body); setOffline(false); return d; }
  catch (e) { if (e.status === 401 && token) logout(); throw e; }
}

/* Offline-capable change: sent now, or queued on this device and sent automatically when the connection is back */
async function mutate(method, path, body, label) {
  const key = uid();
  try { const data = await rawFetch(method, path, body, key); setOffline(false); return { queued: false, data }; }
  catch (e) {
    if (!(e instanceof NetError)) { if (e.status === 401 && token) logout(); throw e; }
    await DB.put({ id: key, userId: me.id, method, path, body, label, createdAt: Date.now() });
    setOffline(true);
    await updateStatus();
    toast("اینترنت قطع است: تغییر روی این دستگاه ذخیره شد و پس از اتصال خودکار ارسال می‌شود", "warn");
    return { queued: true };
  }
}

let syncing = false;
async function syncOutbox() {
  if (syncing || !me || !token) return;
  syncing = true;
  let sent = 0;
  try {
    const items = (await DB.all("outbox")).filter((i) => i.userId === me.id && !i.failed).sort((a, b) => a.createdAt - b.createdAt);
    for (const it of items) {
      try { await rawFetch(it.method, it.path, it.body, it.id); await DB.del(it.id); sent++; }
      catch (e) {
        if (e instanceof NetError) { setOffline(true); break; }
        if (e.status === 401) { toast("نشست شما منقضی شده؛ دوباره وارد شوید تا تغییرات ذخیره‌شده ارسال شوند", "err"); break; }
        await DB.put({ ...it, failed: true, error: e.message });
      }
    }
    if (sent) setOffline(false);
  } catch { /* IndexedDB unavailable */ }
  finally { syncing = false; await updateStatus(); }
  if (sent) { toast(num(sent) + " تغییر ذخیره‌شده به سرور ارسال شد"); reload(); }
}

const statusBox = h("span", { class: "sync" });
async function updateStatus() {
  let pending = 0, failed = 0;
  try {
    const items = me ? (await DB.all("outbox")).filter((i) => i.userId === me.id) : [];
    pending = items.filter((i) => !i.failed).length;
    failed = items.filter((i) => i.failed).length;
  } catch { /* ignore */ }
  statusBox.innerHTML = "";
  statusBox.append(offline || !navigator.onLine ? tag("آفلاین", "bad") : tag("آنلاین", "ok"));
  if (pending) statusBox.append(tag(num(pending) + " تغییر در انتظار ارسال", "warn"), h("button", { class: "btn sm ghost", onclick: () => syncOutbox() }, "ارسال اکنون"));

function formEl(fields, submitLabel, onSubmit) {
  const form = h("form", { class: "form" });
  for (const f of fields) {
    let input;
    if (f.type === "select") {
      input = h("select", { name: f.name, required: !!f.required },
        f.placeholder !== undefined ? h("option", { value: "" }, f.placeholder) : null,
        (f.options || []).map((o) => h("option", { value: o.value }, o.label)));
    } else if (f.type === "checkbox") {
      input = h("input", { type: "checkbox", name: f.name });
    } else if (f.type === "textarea") {
      input = h("textarea", { name: f.name, rows: 3, required: !!f.required });
    } else {
      input = h("input", { type: f.type || "text", name: f.name, required: !!f.required, placeholder: f.placeholder || "", min: f.min, max: f.max, step: f.step, dir: f.ltr ? "ltr" : null, autocomplete: "off" });
    }
    if (f.value !== undefined && f.value !== null) {
      if (f.type === "checkbox") input.checked = !!f.value;
      else if (f.type === "textarea") input.textContent = f.value;
      else input.value = f.value;
    }
    form.append(h("label", { class: f.type === "checkbox" ? "chk" : "" }, f.type === "checkbox" ? [input, f.label] : [h("span", {}, f.label + (f.required ? " *" : "")), input]));
  }
  form.append(h("div", {}, h("button", { class: "btn", type: "submit" }, submitLabel)));
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = {};
    for (const f of fields) {
      const el = form.elements[f.name];
      if (f.type === "checkbox") { if (el.checked) data[f.name] = true; continue; }
      let v = el.value.trim();
      if (v === "") continue;
      if (f.type === "number") v = Number(v);
      if (f.type === "datetime-local") v = new Date(v).toISOString();
      data[f.name] = v;
    }
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true;
    try { await onSubmit(data, form); } catch (err) { toast(err.message, "err"); } finally { btn.disabled = false; }
  });
  return form;
}
function modal(title, fields, submitLabel, onSubmit) {
  const overlay = h("div", { class: "overlay" });
  const close = () => overlay.remove();
  const form = formEl(fields, submitLabel, async (d, f) => { await onSubmit(d, f); close(); });
  overlay.append(h("div", { class: "modal" }, h("h3", {}, title), form, h("button", { class: "btn ghost", type: "button", onclick: close }, "انصراف")));
  document.body.append(overlay);

}

async function placeModal(s) {

async function pAttendance(box) {
  if (!me.dormitoryId) return box.append(card("", h("p", {}, "به خوابگاهی متصل نشده‌اید.")));
  const dateIn = h("input", { type: "date", style: "max-width:190px" });

  const load = async () => {
    area.innerHTML = "";
    const path = `/dormitories/${me.dormitoryId}/attendance${dateIn.value ? "?date=" + dateIn.value : ""}`;
    const r = await api("GET", path);
    if (!dateIn.value) dateIn.value = r.date;
    const marks = new Map(r.items.filter((i) => i.status).map((i) => [i.studentId, i.status]));
    const btns = new Map();
    const counter = h("b", {});
    const refresh = () => { counter.textContent = `${num(marks.size)} از ${num(r.items.length)} نفر مشخص شده`; };
    const paint = (id) => { for (const [st, b] of btns.get(id)) b.className = marks.get(id) === st ? "on " + st : ""; refresh(); };
    const setMany = (items, st) => { for (const i of items) { marks.set(i.studentId, st); paint(i.studentId); } };

    const groups = new Map();
    for (const i of r.items) { const k = `${i.building} / اتاق ${i.room}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); }
    if (!r.items.length) area.append(h("p", { class: "muted" }, "ساکنی در این خوابگاه ثبت نشده است."));
    for (const [title, items] of groups) {

        h("div", { class: "row", style: "justify-content:space-between;margin-bottom:6px" }, h("h3", { style: "margin:0" }, title), act("همه‌ی این اتاق حاضر", () => setMany(items, "PRESENT"), "ghost")),
        items.map((i) => {
          const m = new Map(); btns.set(i.studentId, m);
          const seg = h("div", { class: "seg big" }, ["PRESENT", "ABSENT", "ON_LEAVE"].map((st) => {
            const b = h("button", { type: "button", onclick: () => { marks.set(i.studentId, st); paint(i.studentId); } }, t("att", st));
            m.set(st, b); return b;
          }));
          return h("div", { class: "arow" }, h("span", { class: "aname" }, fullName(i), i.kind !== "BED" ? " (" + t("kind", i.kind) + ")" : i.bed ? " — تخت " + i.bed : ""), seg);
        })));
    }
    area.append(h("div", { class: "savebar" }, counter,
      act("همه‌ی ساکنان حاضر", () => setMany(r.items, "PRESENT"), "ghost"),
      act("ثبت حضور و غیاب", async () => {
        const records = [...marks].map(([studentId, status]) => ({ studentId, status }));
        if (!records.length) throw new Error("هنوز وضعیت هیچ‌کس مشخص نشده است");
        const res = await mutate("PUT", `/dormitories/${me.dormitoryId}/attendance`, { date: dateIn.value, records }, `حضور و غیاب ${dateIn.value} (${num(records.length)} نفر)`);
        if (res.queued) {
          await patchCache(path, (c) => { const mm = new Map(records.map((x) => [x.studentId, x.status])); for (const i of c.items) if (mm.has(i.studentId)) { i.status = mm.get(i.studentId); i.recorded = true; } c.recorded = c.items.filter((i) => i.recorded).length; return c; });
        } else toast("حضور و غیاب ثبت شد");
        await load();
      }, "ok")));
    for (const id of btns.keys()) paint(id);
    refresh();
  };
  box.append(card("حضور و غیاب", h("div", { class: "row" }, h("label", {}, "تاریخ: "), dateIn, act("نمایش", load, "ghost"))), area);

/* ---------- Jalali (Persian) date helpers ---------- */
function jalaliToGregorian(jy, jm, jd) {
  jy += 1595;
  let days = -355668 + (365 * jy) + (Math.floor(jy / 33) * 8) + Math.floor(((jy % 33) + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  let gy = 400 * Math.floor(days / 146097);
  days %= 146097;
  if (days > 36524) { gy += 100 * Math.floor(--days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const sal = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm = 0;
  while (gm < 13 && gd > sal[gm]) { gd -= sal[gm]; gm++; }
  return [gy, gm, gd];
}
const latinDigits = (x) => String(x).replace(/[۰-۹]/g, (c) => c.charCodeAt(0) - 0x06f0).replace(/[٠-٩]/g, (c) => c.charCodeAt(0) - 0x0660);
/** "1405/01/01 نوروز" or "2026-03-21 Nowruz" -> { date: "2026-03-21", title } */
function parseDateLine(line) {
  const m = latinDigits(line).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\s*(.*)$/);
  if (!m) return null;
  let y = +m[1], mo = +m[2], d = +m[3];
  if (y < 1700) [y, mo, d] = jalaliToGregorian(y, mo, d);
  return { date: `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`, title: m[4].trim() || "تعطیل" };
}

/* ---------- maintenance & equipment ---------- */
async function uploadFile(entity, entityId, file) {
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch(`/api/attachments?entity=${entity}&entityId=${entityId}`, { method: "POST", headers: { Authorization: "Bearer " + token }, body: fd });
  let data = null;
  try { data = await res.json(); } catch { /* empty */ }
  if (!res.ok) throw new Error(Array.isArray(data?.message) ? data.message.join(" | ") : data?.message || "خطا " + res.status);
  return data;
}
async function downloadAttachment(a) {
  const res = await fetch(`/api/attachments/${a.id}/download`, { headers: { Authorization: "Bearer " + token } });
  if (!res.ok) throw new Error("دانلود فایل ممکن نشد");
  const url = URL.createObjectURL(await res.blob());
  const link = h("a", { href: url, download: a.filename });
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

        if (supervisor && x.status === "FIXED") {
          p.push(act("تأیید رفع", async () => { await api("POST", `/maintenance/${x.id}/confirm`, {}); load(); }, "ok"));
          p.push(act("هنوز رفع نشده", () => modal("بازگشایی", [{ name: "note", label: "چه چیزی هنوز مشکل دارد؟", type: "textarea" }], "ثبت", async (d) => { await api("POST", `/maintenance/${x.id}/reopen`, d); load(); }), "warn"));
        }
        return p;
      } },
    ], r.items, "درخواستی ثبت نشده است."));
  };
  status.addEventListener("change", () => load().catch((e) => toast(e.message, "err")));
  kind.addEventListener("change", () => load().catch((e) => toast(e.message, "err")));
  box.append(card("درخواست‌ها", h("div", { class: "row", style: "margin-bottom:10px" }, status, kind), area));
  await load();
}

/* ---------- shell ---------- */
const DASH = ["dash", "داشبورد", pDash];
const MENUS = {
  SUPER_ADMIN: [DASH, ["unis", "دانشگاه‌ها و مدیران ارشد", pUnis], ["sys", "وضعیت سیستم", pSystem], ["hlist", "بررسی‌های بهداشت", pHealthList], ["halerts", "هشدارهای بهداشت", pHealthAlerts]],
  SENIOR_ADMIN: [DASH, ["users", "مدیران سیستم", pUsers], ["maint", "تعمیرات و تجهیزات", pMaintenance], ["vac", "ظرفیت خالی", pVacancy], ["attview", "حضور و غیاب", pAttendView], ["esc", "گزارش‌های ارجاعی", pEscalated], ["work", "کارکرد ماهانه", pWork], ["hlist", "بررسی‌های بهداشت", pHealthList], ["halerts", "هشدارهای بهداشت", pHealthAlerts], ["leaves", "مرخصی‌ها", pLeaves]],
  SYSTEM_MANAGER: [DASH, ["dorms", "خوابگاه‌ها", pDorms], ["users", "کاربران", pUsers], ["maint", "تعمیرات و تجهیزات", pMaintenance], ["shifts", "شیفت‌ها", pShifts], ["shiftcfg", "تنظیمات شیفت و تعطیلات", pShiftSettings], ["vac", "ظرفیت خالی", pVacancy], ["attview", "حضور و غیاب", pAttendView], ["esc", "گزارش‌های ارجاعی", pEscalated], ["work", "کارکرد ماهانه", pWork], ["hlist", "بررسی‌های بهداشت", pHealthList], ["halerts", "هشدارهای بهداشت", pHealthAlerts], ["leaves", "مرخصی‌ها", pLeaves]],
  DORM_SUPERVISOR: [DASH, ["struct", "ساختمان و اتاق‌ها", pStructure], ["students", "دانشجویان", pStudents], ["att", "حضور و غیاب", pAttendance], ["reports", "گزارش‌های خوابگاه", pReports], ["shifts", "شیفت‌ها", pShifts], ["staff", "کارکنان", pUsers], ["maint", "تعمیرات و تجهیزات", pMaintenance], ["refs", "ارجاع‌ها", pReferrals], ["halerts", "هشدارهای بهداشت", pHealthAlerts], ["hlist", "بررسی‌های بهداشت", pHealthList], ["work", "کارکرد ماهانه", pWork], ["leaves", "مرخصی‌ها", pLeaves], ["pres", "حضور من", pPresence]],
  ATTENDANT: [DASH, ["att", "حضور و غیاب", pAttendance], ["reports", "گزارش‌ها", pReports], ["refs", "ارجاع به مشاوره", pReferrals], ["shifts", "شیفت‌های من", pShifts], ["leaves", "مرخصی", pLeaves], ["pres", "حضور من", pPresence]],
  SERVICE_STAFF: [DASH, ["leaves", "مرخصی", pLeaves], ["pres", "حضور من", pPresence]],
  COUNSELING: [DASH, ["refs", "ارجاع‌ها", pReferrals], ["psy", "برنامه روانشناسان", pPsych]],
  HEALTH_LIAISON: [DASH, ["hinspect", "بررسی بهداشت", pHealthInspect], ["hitems", "عناوین چک‌لیست", pHealthItems], ["hlist", "سوابق بررسی", pHealthList], ["halerts", "وضعیت رفع موارد", pHealthAlerts]],
};
let current = "dash";

function changePassword() {
  modal("تغییر رمز عبور", [
    { name: "oldPassword", label: "رمز فعلی", type: "password", required: true },
    { name: "newPassword", label: "رمز جدید (حداقل ۶ کاراکتر)", type: "password", required: true },
  ], "تغییر", async (d) => { await api("POST", "/auth/change-password", d); toast("رمز تغییر کرد"); });
}

let timersOn = false;
async function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (!token) return renderLogin(app);
  if (!me) {
    try { me = await rawFetch("GET", "/auth/me"); localStorage.setItem("mad_me", JSON.stringify(me)); }
    catch (e) {
      const cached = localStorage.getItem("mad_me");
      if (e instanceof NetError && cached) { me = JSON.parse(cached); offline = true; }
      else { token = null; localStorage.removeItem("mad_token"); return renderLogin(app); }
    }
  }
  const menu = MENUS[me.role] || [DASH];
  if (!menu.find((m) => m[0] === current)) current = "dash";
  const content = h("main");
  app.append(
    h("header", {}, h("div", { class: "brand" }, logo(36), h("h1", {}, "ماد"), h("span", { class: "who" }, "مدیریت اسکان دانشجویی")), statusBox,
      h("span", { class: "who" }, `${fullName(me)} · ${t("role", me.role)}`),
      h("button", { class: "btn sm ghost", onclick: changePassword }, "تغییر رمز"),
      h("button", { class: "btn sm ghost", onclick: logout }, "خروج")),
    h("div", { class: "shell" },
      h("nav", {}, menu.map(([id, title]) => h("button", { class: id === current ? "on" : "", onclick: () => { current = id; render(); } }, title))),
      content));
  rerender = async () => {
    content.innerHTML = "";
    const page = menu.find((m) => m[0] === current)[2];
    try { await page(content); } catch (e) { content.append(card("خطا", h("p", { style: "color:var(--bad)" }, e.message))); }
  };
  rerender();
  updateStatus();
  if (!timersOn) {
    timersOn = true;
    window.addEventListener("online", () => { setOffline(false); syncOutbox(); });
    window.addEventListener("offline", () => setOffline(true));
    setInterval(() => syncOutbox(), 20000);
  }
  if (bootedFor !== me.id) { bootedFor = me.id; syncOutbox(); prefetch(); }
}

function loginError(e) {
  if (e instanceof NetError) return "اتصال به سرور برقرار نیست. اینترنت یا شبکه‌ی داخلی را بررسی کنید.";
  if (e.status === 401) return "نام کاربری یا رمز عبور درست نیست، یا حساب موقتاً قفل شده است (بعد از ۵ تلاش ناموفق، ۱۵ دقیقه قفل می‌شود).";
  if (e.status === 429) return "تلاش‌های ورود زیاد بود. یک دقیقه صبر کنید و دوباره امتحان کنید.";
  return e.message;
}
function renderLogin(app) {
  const user = h("input", { name: "username", placeholder: "کد ملی", dir: "ltr", inputmode: "numeric", autocomplete: "username", required: true, autofocus: true });
  const pass = h("input", { name: "password", type: "password", placeholder: "رمز عبور", dir: "ltr", autocomplete: "current-password", required: true });
  const eye = h("button", { type: "button", class: "eye", title: "نمایش / پنهان‌کردن رمز", onclick: () => { pass.type = pass.type === "password" ? "text" : "password"; } }, svgIcon(ICON.eye));
  const err = h("div", { class: "login-err", style: "display:none" });
  const btn = h("button", { class: "login-btn", type: "submit" }, "ورود");
  const form = h("form", {
    onsubmit: async (e) => {
      e.preventDefault();
      err.style.display = "none";
      btn.disabled = true;
      btn.replaceChildren(h("span", { class: "spin" }), "در حال ورود…");
      try {
        const r = await api("POST", "/auth/login", { username: latinDigits(user.value.trim()), password: pass.value });
        token = r.accessToken; me = null; localStorage.setItem("mad_token", token); current = "dash";
        render();
      } catch (ex) {
        err.textContent = loginError(ex); err.style.display = "block";
        btn.disabled = false; btn.textContent = "ورود";
      }
    },
  }, err, h("div", { class: "lf" }, svgIcon(ICON.user), user), h("div", { class: "lf" }, svgIcon(ICON.lock), pass, eye), btn);
  app.append(h("div", { class: "login-bg" },
    h("div", { class: "login-card" }, logo(96), h("h1", {}, "ماد"), h("p", { class: "tagline" }, "سامانه‌ی مدیریت اسکان دانشجویی"),
      navigator.onLine ? null : h("div", { class: "login-err" }, "اینترنت قطع است؛ ورود فقط با اتصال به سرور ممکن است."),
      form,
      h("div", { class: "login-foot" }, "ورود با کد ملی و رمز عبور", h("br"), "در صورت فراموشی رمز، با مدیر مربوطه تماس بگیرید"))));
}
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
