<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ماد — مدیریت اسکان دانشجویی</title>
<meta name="theme-color" content="#14202e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ماد">
<style>
:root{--bg:#eef3fa;--card:#fff;--ink:#1b2735;--mut:#6a778a;--line:#e5ecf5;--pri:#1e6fd9;--pri-d:#1858ae;--ok:#12805c;--bad:#c0392b;--warn:#b7791f;--sh:0 8px 26px rgba(15,40,90,.08)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,#e3edfa 0,var(--bg) 360px) fixed;color:var(--ink);font:14px/1.75 "Segoe UI",Tahoma,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 20px;color:#fff;background:radial-gradient(700px 200px at 90% -40%,#2f7de0 0,transparent 70%),linear-gradient(135deg,#0e2a55,#12202f);box-shadow:0 6px 22px rgba(10,25,60,.28)}
header h1{font-size:18px;margin:0;flex:none;letter-spacing:.3px}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.logo{display:inline-block;line-height:0;flex:none}.logo svg{width:100%;height:100%}
header .who{font-size:12.5px;opacity:.85}
.shell{display:flex;gap:16px;padding:16px 20px;align-items:flex-start;max-width:1500px;margin:0 auto}
nav{flex:0 0 206px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;position:sticky;top:12px;box-shadow:var(--sh)}
nav button{display:block;width:100%;text-align:right;background:none;border:0;padding:8px 12px;margin:1px 0;border-radius:10px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;transition:background .15s}
nav button:hover{background:#eef4fc}
nav button.on{background:linear-gradient(135deg,#3b8cf0,#1858ae);color:#fff;box-shadow:0 6px 14px rgba(30,111,217,.3)}
main{flex:1;min-width:0;animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2,.card h3{margin:0 0 10px;font-size:15px}
.card h3{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.stat{background:linear-gradient(135deg,#f1f7ff,#fff);border:1px solid #dfeaf8;border-radius:14px;padding:11px 14px}
.stat b{display:block;font-size:22px;line-height:1.5;background:linear-gradient(135deg,#2f7de0,#1858ae);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--mut);font-size:12.5px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 12px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mut)}
.form label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
input,select,textarea{font:inherit;font-size:14px;padding:0 12px;height:40px;border:1.5px solid #e1e8f1;border-radius:11px;background:#f6f9fd;color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s,background .15s}
textarea{height:auto;padding:9px 12px}
input[type=checkbox]{width:auto;height:auto;accent-color:var(--pri)}
input:focus,select:focus,textarea:focus{outline:none;background:#fff;border-color:var(--pri);box-shadow:0 0 0 4px rgba(30,111,217,.14)}
.btn{font:inherit;font-size:13.5px;font-weight:600;border:0;color:#fff;padding:0 16px;height:38px;border-radius:11px;cursor:pointer;background:linear-gradient(135deg,#3b8cf0,#1858ae);box-shadow:0 6px 14px rgba(30,111,217,.26);transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 9px 18px rgba(30,111,217,.34)}
.btn:active{transform:none}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px;border-radius:9px;box-shadow:0 4px 10px rgba(30,111,217,.22)}
.btn.ghost{background:#e9f0f9;color:var(--ink);box-shadow:none}.btn.ghost:hover{background:#dde8f5;box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#25ab80,#12805c);box-shadow:0 6px 14px rgba(18,128,92,.26)}
.btn.bad{background:linear-gradient(135deg,#e5655a,#c0392b);box-shadow:0 6px 14px rgba(192,57,43,.26)}
.btn.warn{background:linear-gradient(135deg,#e0a33a,#b7791f);box-shadow:0 6px 14px rgba(183,121,31,.26)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{background:#f2f6fc;color:var(--mut);font-weight:600;font-size:12px}
tbody tr:hover td{background:#f8fbff}
td .btn{margin:2px 0 2px 4px}
td.actions{white-space:normal;min-width:230px}
.tag{display:inline-block;padding:0 9px;border-radius:999px;font-size:12px;line-height:22px;background:#e8eef6;color:#43526a}
.tag.ok{background:#daf3e9;color:var(--ok)}.tag.bad{background:#fde3df;color:var(--bad)}.tag.warn{background:#fdf0d3;color:var(--warn)}
.muted{color:var(--mut)}
p{margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex}
.seg button{border:1.5px solid #d5deea;background:#fff;padding:5px 13px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);margin-right:-1.5px}
.seg button:first-child{border-radius:0 9px 9px 0;margin-right:0}.seg button:last-child{border-radius:9px 0 0 9px}
.seg button.on.PRESENT{background:linear-gradient(135deg,#25ab80,#12805c);color:#fff;border-color:var(--ok)}
.seg button.on.ABSENT{background:linear-gradient(135deg,#e5655a,#c0392b);color:#fff;border-color:var(--bad)}
.seg button.on.ON_LEAVE{background:linear-gradient(135deg,#e0a33a,#b7791f);color:#fff;border-color:var(--warn)}
.seg.big button{padding:8px 14px;font-size:14px;min-width:62px}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}.aname{flex:1;min-width:120px}
.savebar{position:sticky;bottom:10px;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:9px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(15,40,90,.18);z-index:5;margin-top:12px}
.overlay{position:fixed;inset:0;background:rgba(8,18,36,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .2s ease both}
.modal{background:#fff;border-radius:20px;padding:20px 22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(5,15,40,.45)}
.modal h3{margin:0 0 12px;font-size:16px}
.modal .form{grid-template-columns:1fr}
.modal>.btn.ghost{margin-top:10px;width:100%}
#toast{position:fixed;bottom:18px;left:18px;right:18px;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:99}
#toast div{background:#14202e;color:#fff;padding:9px 18px;border-radius:12px;max-width:640px;pointer-events:auto;font-size:13.5px;box-shadow:0 12px 30px rgba(5,15,40,.35);animation:rise .25s ease both}
#toast .err{background:var(--bad)}#toast .ok{background:var(--ok)}#toast .warn{background:var(--warn)}
pre{background:#f4f8fd;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;direction:ltr;text-align:left;font-size:12.5px}
.ltr{direction:ltr;text-align:left}
a{color:var(--pri)}
.jd{position:relative;display:block;width:100%}.jd-wrap{display:block;width:100%}
.jd-input{cursor:pointer;text-align:center}
.jd-pop{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(10,25,60,.3);padding:12px;width:294px;animation:rise .15s ease both}
.jd-head{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.jd-head select{height:32px;font-size:13px;padding:0 6px;border-radius:9px;flex:1}
.jd-nav{width:30px;height:30px;border:0;border-radius:9px;background:#eef3fa;cursor:pointer;font-size:17px;line-height:1;flex:none}
.jd-nav:hover{background:#dfeafa}
.jd-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.jd-wd{font-size:11.5px;color:var(--mut);padding:3px 0}.jd-wd.fri{color:var(--bad)}
.jd-day{height:34px;border:0;background:none;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;color:var(--ink)}
.jd-day:hover{background:#eaf2fd}.jd-day.today{box-shadow:inset 0 0 0 1.5px var(--pri)}.jd-day.fri{color:var(--bad)}
.jd-day.sel,.jd-day.sel:hover{background:linear-gradient(135deg,#3b8cf0,#1858ae);color:#fff}
.jd-foot{display:flex;justify-content:space-between;margin-top:8px}
.jdt{display:flex;gap:6px;width:100%}.jdt .jd{flex:1}.jdt input[type=time]{width:104px;flex:none;text-align:center}
.lt{display:flex;background:#eef3fa;border-radius:12px;padding:4px;margin:0 0 16px}
.lt button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--mut)}
.lt button.on{background:#fff;color:var(--pri-d);box-shadow:0 2px 8px rgba(15,40,90,.12);font-weight:600}
.login-info{background:#eaf3ff;color:#1858ae;border-radius:12px;padding:9px 13px;margin:0 0 12px;font-size:13px;text-align:right;line-height:1.8}
.steps{display:flex;gap:4px;margin:8px 0}.steps i{flex:1;height:6px;border-radius:3px;background:#dfe7f1}
.steps i.on{background:linear-gradient(90deg,#3b8cf0,#1858ae)}.steps.bad i.on{background:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.chip{border:1.5px solid #d5deea;background:#fff;border-radius:999px;padding:4px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);transition:all .12s}
.chip:hover{border-color:var(--pri)}
.chip.on{background:linear-gradient(135deg,#3b8cf0,#1858ae);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(30,111,217,.28)}
.jt{display:inline-flex;gap:4px;align-items:center}.jt select{width:72px;padding:0 6px;text-align:center}
.hm{position:relative}
.hm-btn{width:38px;height:38px;border:0;border-radius:11px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;line-height:0;display:flex;align-items:center;justify-content:center;transition:background .15s}
.hm-btn:hover{background:rgba(255,255,255,.26)}.hm-btn svg{width:22px;height:22px}
.hm-panel{position:absolute;top:46px;left:0;min-width:210px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(10,25,60,.35);padding:6px;z-index:120;animation:rise .15s ease both}
.hm-panel button{display:block;width:100%;text-align:right;border:0;background:none;padding:9px 12px;border-radius:9px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.hm-panel button:hover{background:#eef4fc}.hm-panel button.danger{color:var(--bad)}.hm-panel hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;background:linear-gradient(90deg,transparent,#3b8cf0,#1b9aaa,transparent) no-repeat;background-size:45% 100%;animation:bar 1.1s linear infinite}
#bar.on{opacity:1}
@keyframes bar{from{background-position:-45% 0}to{background-position:145% 0}}
.btn .spin{width:13px;height:13px;border-width:2px;margin-left:6px}
.btn.sm .spin{margin-left:0}
.btn.ghost .spin{border-color:rgba(0,0,0,.2);border-top-color:#1b2735}
.help h3{margin:14px 0 4px;font-size:14px;color:var(--pri-d)}.help p{margin:0 0 6px;color:#3b4a5e}
.sync{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ---- login ---- */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:88px 20px 36px;position:relative;overflow:hidden;background:radial-gradient(1100px 560px at 88% -8%,#2f7de0 0,transparent 62%),radial-gradient(900px 520px at -12% 112%,#1b9aaa 0,transparent 58%),linear-gradient(160deg,#0e2a55,#12202f)}
.login-bg::before,.login-bg::after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.07}
.login-bg::before{width:460px;height:460px;top:-170px;left:-130px}.login-bg::after{width:320px;height:320px;bottom:-120px;right:-90px}
.login-card{position:relative;z-index:1;width:100%;max-width:392px;background:#fff;border-radius:24px;padding:0 30px 24px;box-shadow:0 30px 80px rgba(5,15,40,.5);text-align:center;animation:rise .5s ease both}
.login-card .logo{width:80px;height:80px;margin:-40px auto 12px;filter:drop-shadow(0 12px 20px rgba(15,60,130,.5))}
.login-card h1{margin:0;font-size:26px;color:#14202e;letter-spacing:.5px}
.login-card .tagline{margin:2px 0 20px;color:var(--mut);font-size:13px}
.lf{position:relative;margin-bottom:12px}
.lf>svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#8a97a8;pointer-events:none}
.lf input{height:46px;padding:0 42px 0 40px;font-size:14.5px;border-radius:13px;text-align:right}
.lf .eye{position:absolute;left:5px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:#8a97a8;padding:7px;line-height:0;box-shadow:none;height:auto}
.lf .eye:hover{color:var(--pri);transform:translateY(-50%)}.lf .eye svg{width:18px;height:18px}
.login-btn{width:100%;height:48px;margin-top:4px;font:inherit;font-size:16px;font-weight:700;border:0;border-radius:14px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#3b8cf0,#1858ae);box-shadow:0 10px 22px rgba(30,111,217,.38);transition:transform .15s,box-shadow .15s}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px rgba(30,111,217,.46)}
.login-btn:disabled{opacity:.75;cursor:wait;transform:none}
.login-err{background:#fdecea;color:#b3261e;border-radius:12px;padding:9px 13px;margin:0 0 12px;font-size:13px;text-align:right;line-height:1.8}
.login-foot{margin-top:18px;color:#98a4b3;font-size:12px;line-height:1.9}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-left:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{max-width:660px}
.modal .form{grid-template-columns:repeat(2,1fr)}
.modal .form label:has(textarea),.modal .form label.chk,.modal .form>div:last-child{grid-column:1/-1}
@media(max-width:800px){
  .shell{flex-direction:column;padding:12px;gap:12px}
  nav{flex:none;width:100%;position:static;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:6px}
  nav button{width:auto;flex:none;white-space:nowrap;margin:0}
  header{padding:10px 14px}.brand .who{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}
  .form,.modal .form{grid-template-columns:1fr}
  .stat b{font-size:20px}
}
</style>
</head>
<body>
<div id="bar"></div>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
/* ---------- tiny helpers ---------- */
const h = (tag, props, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
};
const toast = (msg, type = "ok") => {
  const t = h("div", { class: type }, msg);
  document.getElementById("toast").append(t);
  setTimeout(() => t.remove(), type === "err" ? 7000 : 3000);
};
const fmt = (d) => d ? new Intl.DateTimeFormat("fa-IR-u-ca-persian", { dateStyle: "medium", timeStyle: "short", timeZone: "Asia/Tehran" }).format(new Date(d)) : "—";
const fmtDay = (d) => d ? new Intl.DateTimeFormat("fa-IR-u-ca-persian", { dateStyle: "medium", timeZone: "Asia/Tehran" }).format(new Date(d)) : "—";
const num = (n) => new Intl.NumberFormat("fa-IR").format(n ?? 0);

/* ---------- Jalali (Persian) calendar: conversion + date picker ---------- */
function gregorianToJalali(gy, gm, gd) {
  const g = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 355666 + (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) + gd + g[gm - 1];
  let jy = -1595 + (33 * Math.floor(days / 12053));
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { jy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  const jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
  return [jy, jm, jd];
}
const JMONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
const JWD = ["ش", "ی", "د", "س", "چ", "پ", "ج"];
const faDigits = (x) => String(x).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
const pad2 = (n) => String(n).padStart(2, "0");
const jLeap = (jy) => { const [a, b, c] = jalaliToGregorian(jy, 12, 30); const r = gregorianToJalali(a, b, c); return r[1] === 12 && r[2] === 30; };
const jMonthLen = (jy, jm) => (jm <= 6 ? 31 : jm <= 11 ? 30 : jLeap(jy) ? 30 : 29);
const gStr = (g) => `${g[0]}-${pad2(g[1])}-${pad2(g[2])}`;
const todayG = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Tehran" }).format(new Date());
function jalaliLabel(greg) {
  if (!greg) return "";
  const [y, m, d] = greg.split("-").map(Number);
  const [jy, jm, jd] = gregorianToJalali(y, m, d);
  return faDigits(`${jy}/${pad2(jm)}/${pad2(jd)}`);
}
const weekdayName = (greg) => ["یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنجشنبه", "جمعه", "شنبه"][new Date(greg + "T00:00:00Z").getUTCDay()];

/** Jalali date field. Behaves like an input: `.value` is a Gregorian "YYYY-MM-DD" (or "") and a "change" event fires. */
function jdate(initial = "", opts = {}) {
  const wrap = h("span", { class: "jd" });
  const input = h("input", { readonly: true, class: "jd-input", placeholder: opts.placeholder || "انتخاب تاریخ", autocomplete: "off" });
  let value = initial || "";
  input.value = jalaliLabel(value);
  Object.defineProperty(wrap, "value", { get: () => value, set: (v) => { value = v || ""; input.value = jalaliLabel(value); } });
  let pop = null;
  const close = () => { if (pop) { pop.remove(); pop = null; document.removeEventListener("mousedown", outside, true); } };
  const outside = (e) => { if (pop && !pop.contains(e.target) && e.target !== input) close(); };
  const pick = (g) => { value = g; input.value = jalaliLabel(g); wrap.dispatchEvent(new Event("change", { bubbles: true })); close(); };
  const open = () => {
    if (pop) return close();
    const base = value || todayG();
    let [vy, vm] = gregorianToJalali(...base.split("-").map(Number));
    pop = h("div", { class: "jd-pop" });
    const draw = () => {
      pop.replaceChildren();
      const [ty, tm, td] = gregorianToJalali(...todayG().split("-").map(Number));
      const yearSel = h("select", {}, Array.from({ length: 21 }, (_, i) => vy - 10 + i).map((y) => h("option", { value: y, selected: y === vy }, faDigits(y))));
      const monSel = h("select", {}, JMONTHS.map((n, i) => h("option", { value: i + 1, selected: i + 1 === vm }, n)));
      yearSel.addEventListener("change", () => { vy = +yearSel.value; draw(); });
      monSel.addEventListener("change", () => { vm = +monSel.value; draw(); });

class NetError extends Error {}

async function rawFetch(method, path, body, idemKey) {

}
async function rawFetchInner(method, path, body, idemKey) {

      headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}), ...(idemKey ? { "Idempotency-Key": idemKey } : {}) },

  if (!res.ok) {
    const m = data && data.message;

}

/* IndexedDB: "kv" = cached GET responses per user, "outbox" = changes waiting to be sent */
const DB = {
  _db: null,
  open() {
    if (!this._db) this._db = new Promise((res, rej) => {
      const r = indexedDB.open("mad", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("outbox", { keyPath: "id" }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async tx(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && "result" in out ? out.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  get(k) { return this.tx("kv", "readonly", (s) => s.get(k)); },
  set(k, v) { return this.tx("kv", "readwrite", (s) => { s.put(v, k); }); },
  all(store) { return this.tx(store, "readonly", (s) => s.getAll()); },
  put(item) { return this.tx("outbox", "readwrite", (s) => { s.put(item); }); },
  del(id) { return this.tx("outbox", "readwrite", (s) => { s.delete(id); }); },
};
const ckey = (path) => (me ? me.id : "-") + ":" + path;
const putCache = (path, value) => (me ? DB.set(ckey(path), value).catch(() => {}) : Promise.resolve());
async function patchCache(path, fn) {

}

let offline = false;
const setOffline = (v) => { if (offline !== v) { offline = v; updateStatus(); } };

/* GET: network first, falls back to the last copy saved on this device */
async function api(method, path, body) {
  if (method === "GET") {
    try {
      const data = await rawFetch("GET", path);
      setOffline(false);
      if (me && !path.startsWith("/auth/")) putCache(path, data);
      return data;
    } catch (e) {
      if (e instanceof NetError) {
        const cached = me ? await DB.get(ckey(path)).catch(() => undefined) : undefined;
        setOffline(true);
        if (cached !== undefined) return cached;
      } else if (e.status === 401 && token) logout();
      throw e;
    }
  }
  try { const d = await rawFetch(method, path, body); setOffline(false); return d; }
  catch (e) { if (e.status === 401 && token) logout(); throw e; }
}

/* Offline-capable change: sent now, or queued on this device and sent automatically when the connection is back */
async function mutate(method, path, body, label) {
  const key = uid();
  try { const data = await rawFetch(method, path, body, key); setOffline(false); return { queued: false, data }; }
  catch (e) {
    if (!(e instanceof NetError)) { if (e.status === 401 && token) logout(); throw e; }
    await DB.put({ id: key, userId: me.id, method, path, body, label, createdAt: Date.now() });
    setOffline(true);
    await updateStatus();
    toast("اینترنت قطع است: تغییر روی این دستگاه ذخیره شد و پس از اتصال خودکار ارسال می‌شود", "warn");
    return { queued: true };
  }
}

let syncing = false;
async function syncOutbox() {
  if (syncing || !me || !token) return;
  syncing = true;
  let sent = 0;
  try {
    const items = (await DB.all("outbox")).filter((i) => i.userId === me.id && !i.failed).sort((a, b) => a.createdAt - b.createdAt);
    for (const it of items) {
      try { await rawFetch(it.method, it.path, it.body, it.id); await DB.del(it.id); sent++; }
      catch (e) {
        if (e instanceof NetError) { setOffline(true); break; }
        if (e.status === 401) { toast("نشست شما منقضی شده؛ دوباره وارد شوید تا تغییرات ذخیره‌شده ارسال شوند", "err"); break; }
        await DB.put({ ...it, failed: true, error: e.message });
      }
    }
    if (sent) setOffline(false);
  } catch { /* IndexedDB unavailable */ }
  finally { syncing = false; await updateStatus(); }
  if (sent) { toast(num(sent) + " تغییر ذخیره‌شده به سرور ارسال شد"); reload(); }
}

function formEl(fields, submitLabel, onSubmit) {
  const form = h("form", { class: "form" });
  const isJ = (f) => f.type === "date" || f.type === "datetime-local" || f.type === "time";
  for (const f of fields) {
    let input;
    if (isJ(f)) {
      const w = f.type === "date" ? jdate(f.value || "") : f.type === "time" ? jtime(f.value || "08:00") : jdatetime(f.value || "");
      const hid = h("input", { type: "hidden", name: f.name });
      hid.value = w.value;
      w.addEventListener("change", () => { hid.value = w.value; });
      input = h("span", { class: "jd-wrap" }, w, hid);
    } else if (f.type === "select") {
      input = h("select", { name: f.name, required: !!f.required },
        f.placeholder !== undefined ? h("option", { value: "" }, f.placeholder) : null,
        (f.options || []).map((o) => h("option", { value: o.value }, o.label)));
    } else if (f.type === "checkbox") {
      input = h("input", { type: "checkbox", name: f.name });
    } else if (f.type === "textarea") {
      input = h("textarea", { name: f.name, rows: 3, required: !!f.required });
    } else {
      input = h("input", { type: f.type || "text", name: f.name, required: !!f.required, placeholder: f.placeholder || "", min: f.min, max: f.max, step: f.step, dir: f.ltr ? "ltr" : null, autocomplete: "off" });
    }
    if (!isJ(f) && f.value !== undefined && f.value !== null) {
      if (f.type === "checkbox") input.checked = !!f.value;
      else if (f.type === "textarea") input.textContent = f.value;
      else input.value = f.value;
    }
    form.append(h("label", { class: f.type === "checkbox" ? "chk" : "" }, f.type === "checkbox" ? [input, f.label] : [h("span", {}, f.label + (f.required ? " *" : "")), input]));
  }
  form.append(h("div", {}, h("button", { class: "btn", type: "submit" }, submitLabel)));
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const done = busyButton(form.querySelector("button[type=submit]"));
    try {
      const data = {};
      for (const f of fields) {
        const el = form.elements[f.name];
        if (f.type === "checkbox") { if (el.checked) data[f.name] = true; continue; }
        let v = el.value.trim();
        if (v === "") { if (f.required && isJ(f)) throw new Error("«" + f.label + "» را وارد کنید"); continue; }
        if (f.type === "number") v = Number(v);
        if (f.type === "datetime-local") v = new Date(v).toISOString();
        data[f.name] = v;
      }
      await onSubmit(data, form);
    } catch (err) { toast(err.message, "err"); } finally { done(); }
  });
  return form;
}
function modal(title, fields, submitLabel, onSubmit) {
  const overlay = h("div", { class: "overlay" });
  const close = () => overlay.remove();
  const form = formEl(fields, submitLabel, async (d, f) => { await onSubmit(d, f); close(); });
  overlay.append(h("div", { class: "modal" }, h("h3", {}, title), form, h("button", { class: "btn ghost", type: "button", onclick: close }, "انصراف")));
  document.body.append(overlay);
  return form;
}
function table(cols, rows, empty = "موردی وجود ندارد") {
  if (!rows.length) return h("p", { class: "muted" }, empty);
  return h("div", { class: "tw" }, h("table", {},
    h("thead", {}, h("tr", {}, cols.map((c) => h("th", {}, c.h)))),
    h("tbody", {}, rows.map((r) => h("tr", {}, cols.map((c) => h("td", { class: c.h === "" ? "actions" : null }, c.f(r))))))));
}
const tag = (text, kind = "") => h("span", { class: "tag " + kind }, text);
const card = (title, ...kids) => h("div", { class: "card" }, title ? h("h2", {}, title) : null, ...kids);
const fullName = (o) => o ? `${o.firstName || ""} ${o.lastName || ""}`.trim() : "—";
const act = (label, fn, cls = "") => h("button", { class: "btn sm " + cls, onclick: async (e) => { const done = busyButton(e.currentTarget); try { await fn(); } catch (err) { toast(err.message, "err"); } finally { done(); } } }, label);

async function pDash(box) {
  const d = await api("GET", "/dashboard");
  const stats = [];
  const walk = (obj, prefix = "") => {
    for (const [k, v] of Object.entries(obj || {})) {
      if (v && typeof v === "object" && !Array.isArray(v)) walk(v, (t("stat", k)) + " · ");
      else if (Array.isArray(v)) stats.push([prefix + t("stat", k), v.length]);
      else stats.push([prefix + t("stat", k), typeof v === "boolean" ? (v ? "بله" : "خیر") : v]);
    }
  };
  walk(d);
  if (d && d.healthIssuesOpen > 0 && ["DORM_SUPERVISOR", "SYSTEM_MANAGER", "SENIOR_ADMIN", "SUPER_ADMIN", "HEALTH_LIAISON"].includes(me.role)) {
    box.append(h("div", { class: "card", style: "border-color:var(--bad);background:#fff5f4" },
      h("div", { class: "row", style: "justify-content:space-between" },
        h("b", { style: "color:var(--bad)" }, "⚠ " + num(d.healthIssuesOpen) + " مورد بهداشتی هنوز رفع نشده است"),
        act("مشاهده و اقدام", () => { current = "halerts"; render(); }, "bad"))));
  }
  if (d && d.studentRequestsToDecide > 0 && me.role === "DORM_SUPERVISOR") {
    box.append(h("div", { class: "card", style: "border-color:var(--warn);background:#fffaf0" },
      h("div", { class: "row", style: "justify-content:space-between" },
        h("b", { style: "color:var(--warn)" }, num(d.studentRequestsToDecide) + " درخواست دانشجو منتظر تأیید شماست"),
        act("بررسی", () => { current = "maint"; render(); }, "warn"))));
  }
  box.append(card("داشبورد", h("div", { class: "grid" }, stats.map(([k, v]) => h("div", { class: "stat" }, h("b", {}, typeof v === "number" ? num(v) : v ?? "—"), h("span", {}, k))))));
}

async function loadRooms() {
  const blds = await api("GET", `/dormitories/${me.dormitoryId}/buildings`);
  const rooms = [];
  for (const b of blds) for (const r of await api("GET", `/buildings/${b.id}/rooms`)) if (r.type === "RESIDENTIAL") rooms.push({ ...r, building: b.name });
  return rooms;
}
async function placeModal(s) {
  const rooms = await loadRooms();
  const form = modal("اسکان " + fullName(s), [
    { name: "roomId", label: "اتاق", type: "select", required: true, placeholder: "انتخاب اتاق", options: rooms.map((r) => ({ value: r.id, label: `${r.building} - اتاق ${r.number} (${num(r.capacity)} تخت)` })) },
    { name: "kind", label: "نوع جایگاه", type: "select", required: true, options: opts("kind") },
    { name: "bedId", label: "تخت", type: "select", placeholder: "—", options: [] },
  ], "ثبت", async (d) => {
    const body = { roomId: d.roomId, kind: d.kind, ...(d.bedId ? { bedId: d.bedId } : {}) };
    await api("POST", `/students/${s.id}/${["RESIDENT", "ON_LEAVE"].includes(s.status) ? "move" : "assign"}`, body);
    toast("ثبت شد"); reload();
  });
  const refresh = async () => {
    const bed = form.elements.bedId;
    bed.innerHTML = "";
    const roomId = form.elements.roomId.value;
    if (form.elements.kind.value !== "BED" || !roomId) { bed.disabled = true; bed.append(h("option", { value: "" }, "—")); return; }
    bed.disabled = false;
    const res = await api("GET", `/rooms/${roomId}/residents`);
    const used = new Set(res.residents.map((r) => r.bed?.label).filter(Boolean));
    const room = rooms.find((r) => r.id === roomId);
    const free = (room.beds || []).filter((b) => !used.has(b.label));
    bed.append(h("option", { value: "" }, free.length ? "انتخاب تخت" : "تخت خالی ندارد"), ...free.map((b) => h("option", { value: b.id }, "تخت " + b.label)));
  };
  form.elements.roomId.addEventListener("change", () => refresh().catch((e) => toast(e.message, "err")));
  form.elements.kind.addEventListener("change", () => refresh().catch((e) => toast(e.message, "err")));
  refresh();
}

async function pAttendance(box) {
  if (!me.dormitoryId) return box.append(card("", h("p", {}, "به خوابگاهی متصل نشده‌اید.")));
  const dateIn = jdate("");
  const area = h("div");
  const load = async () => {
    area.innerHTML = "";
    const path = `/dormitories/${me.dormitoryId}/attendance${dateIn.value ? "?date=" + dateIn.value : ""}`;
    const r = await api("GET", path);
    if (!dateIn.value) dateIn.value = r.date;
    const marks = new Map(r.items.filter((i) => i.status).map((i) => [i.studentId, i.status]));
    const btns = new Map();
    const counter = h("b", {});
    const refresh = () => { counter.textContent = `${num(marks.size)} از ${num(r.items.length)} نفر مشخص شده`; };
    const paint = (id) => { for (const [st, b] of btns.get(id)) b.className = marks.get(id) === st ? "on " + st : ""; refresh(); };
    const setMany = (items, st) => { for (const i of items) { marks.set(i.studentId, st); paint(i.studentId); } };

    const groups = new Map();
    for (const i of r.items) { const k = `${i.building} / اتاق ${i.room}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); }
    if (!r.items.length) area.append(h("p", { class: "muted" }, "ساکنی در این خوابگاه ثبت نشده است."));
    for (const [title, items] of groups) {

        h("div", { class: "row", style: "justify-content:space-between;margin-bottom:6px" }, h("h3", { style: "margin:0" }, title), act("همه‌ی این اتاق حاضر", () => setMany(items, "PRESENT"), "ghost")),
        items.map((i) => {
          const m = new Map(); btns.set(i.studentId, m);
          const seg = h("div", { class: "seg big" }, ["PRESENT", "ABSENT", "ON_LEAVE"].map((st) => {
            const b = h("button", { type: "button", onclick: () => { marks.set(i.studentId, st); paint(i.studentId); } }, t("att", st));
            m.set(st, b); return b;
          }));
          return h("div", { class: "arow" }, h("span", { class: "aname" }, fullName(i), i.kind !== "BED" ? " (" + t("kind", i.kind) + ")" : i.bed ? " — تخت " + i.bed : ""), seg);
        })));
    }
    area.append(h("div", { class: "savebar" }, counter,
      act("همه‌ی ساکنان حاضر", () => setMany(r.items, "PRESENT"), "ghost"),
      act("ثبت حضور و غیاب", async () => {
        const records = [...marks].map(([studentId, status]) => ({ studentId, status }));
        if (!records.length) throw new Error("هنوز وضعیت هیچ‌کس مشخص نشده است");
        const res = await mutate("PUT", `/dormitories/${me.dormitoryId}/attendance`, { date: dateIn.value, records }, `حضور و غیاب ${dateIn.value} (${num(records.length)} نفر)`);
        if (res.queued) {
          await patchCache(path, (c) => { const mm = new Map(records.map((x) => [x.studentId, x.status])); for (const i of c.items) if (mm.has(i.studentId)) { i.status = mm.get(i.studentId); i.recorded = true; } c.recorded = c.items.filter((i) => i.recorded).length; return c; });
        } else toast("حضور و غیاب ثبت شد");

/* ---------- Jalali (Persian) date helpers ---------- */
function jalaliToGregorian(jy, jm, jd) {
  jy += 1595;
  let days = -355668 + (365 * jy) + (Math.floor(jy / 33) * 8) + Math.floor(((jy % 33) + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  let gy = 400 * Math.floor(days / 146097);
  days %= 146097;
  if (days > 36524) { gy += 100 * Math.floor(--days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) { gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const sal = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm = 0;
  while (gm < 13 && gd > sal[gm]) { gd -= sal[gm]; gm++; }
  return [gy, gm, gd];
}
const latinDigits = (x) => String(x).replace(/[۰-۹]/g, (c) => c.charCodeAt(0) - 0x06f0).replace(/[٠-٩]/g, (c) => c.charCodeAt(0) - 0x0660);
/** "1405/01/01 نوروز" or "2026-03-21 Nowruz" -> { date: "2026-03-21", title } */
function parseDateLine(line) {
  const m = latinDigits(line).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\s*(.*)$/);
  if (!m) return null;
  let y = +m[1], mo = +m[2], d = +m[3];
  if (y < 1700) [y, mo, d] = jalaliToGregorian(y, mo, d);
  return { date: `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`, title: m[4].trim() || "تعطیل" };
}

/* ---------- maintenance & equipment ---------- */
async function uploadFile(entity, entityId, file) {
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch(`/api/attachments?entity=${entity}&entityId=${entityId}`, { method: "POST", headers: { Authorization: "Bearer " + token }, body: fd });
  let data = null;
  try { data = await res.json(); } catch { /* empty */ }
  if (!res.ok) throw new Error(Array.isArray(data?.message) ? data.message.join(" | ") : data?.message || "خطا " + res.status);
  return data;
}
async function downloadAttachment(a) {
  const res = await fetch(`/api/attachments/${a.id}/download`, { headers: { Authorization: "Bearer " + token } });
  if (!res.ok) throw new Error("دانلود فایل ممکن نشد");
  const url = URL.createObjectURL(await res.blob());
  const link = h("a", { href: url, download: a.filename });
  document.body.append(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

  rerender = async () => {
    content.innerHTML = "";
    const page = menu.find((m) => m[0] === current)[2];
    try { await page(content); } catch (e) { content.append(card("خطا", h("p", { style: "color:var(--bad)" }, e.message))); }
  };
  rerender();
  updateStatus();
  if (!timersOn) {
    timersOn = true;
    document.addEventListener("click", () => document.querySelectorAll(".hm-panel").forEach((p) => (p.style.display = "none")));
    window.addEventListener("online", () => { setOffline(false); syncOutbox(); });
    window.addEventListener("offline", () => setOffline(true));
    setInterval(() => syncOutbox(), 20000);
  }
  if (bootedFor !== me.id) { bootedFor = me.id; syncOutbox(); prefetch(); }
}

function loginError(e) {
  if (e instanceof NetError) return "اتصال به سرور برقرار نیست. اینترنت یا شبکه‌ی داخلی را بررسی کنید.";
  if (e.status === 401) return "نام کاربری یا رمز عبور درست نیست، یا حساب موقتاً قفل شده است (بعد از ۵ تلاش ناموفق، ۱۵ دقیقه قفل می‌شود).";
  if (e.status === 429) return "تلاش‌های ورود زیاد بود. یک دقیقه صبر کنید و دوباره امتحان کنید.";
  return e.message;
}
function loginWith(token_) { token = token_; me = null; localStorage.setItem("mad_token", token); current = "dash"; render(); }

function staffLoginForm() {
  const user = h("input", { name: "username", placeholder: "کد ملی", dir: "ltr", inputmode: "numeric", autocomplete: "username", required: true, autofocus: true });
  const pass = h("input", { name: "password", type: "password", placeholder: "رمز عبور", dir: "ltr", autocomplete: "current-password", required: true });
  const eye = h("button", { type: "button", class: "eye", title: "نمایش / پنهان‌کردن رمز", onclick: () => { pass.type = pass.type === "password" ? "text" : "password"; } }, svgIcon(ICON.eye));
  const err = h("div", { class: "login-err", style: "display:none" });
  const btn = h("button", { class: "login-btn", type: "submit" }, "ورود");
  return h("form", {
    onsubmit: async (e) => {
      e.preventDefault();
      err.style.display = "none";
      const done = busyButton(btn);
      try { const r = await api("POST", "/auth/login", { username: latinDigits(user.value.trim()), password: pass.value }); loginWith(r.accessToken); }
      catch (ex) { err.textContent = loginError(ex); err.style.display = "block"; done(); }
    },
  }, err, h("div", { class: "lf" }, svgIcon(ICON.user), user), h("div", { class: "lf" }, svgIcon(ICON.lock), pass, eye), btn);
}

/** Students: national ID -> SMS code to the registered mobile -> signed in. */
function studentLoginForm() {
  const wrap = h("div");
  const err = h("div", { class: "login-err", style: "display:none" });
  const fail = (m) => { err.textContent = m; err.style.display = "block"; };
  let ctx = { nationalId: "", universityCode: "" };
  const step1 = () => {
    wrap.replaceChildren();
    const nid = h("input", { placeholder: "کد ملی", dir: "ltr", inputmode: "numeric", autocomplete: "off", required: true });
    const uni = h("input", { placeholder: "کد دانشگاه", dir: "ltr", autocomplete: "off" });
    const uniWrap = h("div", { class: "lf", style: "display:none" }, svgIcon(ICON.lock), uni);
    const btn = h("button", { class: "login-btn", type: "submit" }, "دریافت کد ورود");
    wrap.append(err, h("form", {
      onsubmit: async (e) => {
        e.preventDefault(); err.style.display = "none";
        const done = busyButton(btn);
        try {
          ctx = { nationalId: latinDigits(nid.value.trim()), universityCode: uni.value.trim() };
          await api("POST", "/student-auth/request-code", { nationalId: ctx.nationalId, ...(ctx.universityCode ? { universityCode: ctx.universityCode } : {}) });
          step2();
        } catch (ex) {
          if (String(ex.message).includes("کد دانشگاه")) uniWrap.style.display = "block";
          fail(loginError(ex)); done();
        }
      },
    }, h("div", { class: "login-info" }, "کد ملی خود را وارد کنید؛ کد ورود به موبایلی که در سامانه برای شما ثبت شده پیامک می‌شود."),
      h("div", { class: "lf" }, svgIcon(ICON.user), nid), uniWrap, btn));
  };
  const step2 = () => {
    wrap.replaceChildren();
    const code = h("input", { placeholder: "کد ۶ رقمی", dir: "ltr", inputmode: "numeric", maxlength: "6", autocomplete: "one-time-code", required: true, autofocus: true });
    const btn = h("button", { class: "login-btn", type: "submit" }, "ورود");
    const resend = h("button", { type: "button", class: "btn sm ghost", disabled: true }, "ارسال دوباره");
    let left = 60;
    const timer = setInterval(() => {
      if (!resend.isConnected) return clearInterval(timer);
      left--; resend.textContent = left > 0 ? `ارسال دوباره (${faDigits(left)})` : "ارسال دوباره"; resend.disabled = left > 0;
      if (left <= 0) clearInterval(timer);
    }, 1000);
    resend.onclick = async () => { try { await api("POST", "/student-auth/request-code", { nationalId: ctx.nationalId, ...(ctx.universityCode ? { universityCode: ctx.universityCode } : {}) }); toast("کد دوباره ارسال شد"); step2(); } catch (ex) { fail(loginError(ex)); } };
    wrap.append(err, h("form", {
      onsubmit: async (e) => {
        e.preventDefault(); err.style.display = "none";
        const done = busyButton(btn);
        try { const r = await api("POST", "/student-auth/verify", { nationalId: ctx.nationalId, code: latinDigits(code.value.trim()), ...(ctx.universityCode ? { universityCode: ctx.universityCode } : {}) }); loginWith(r.accessToken); }
        catch (ex) { fail(loginError(ex)); done(); }
      },
    }, h("div", { class: "login-info" }, "کد ۶ رقمی را که پیامک شد وارد کنید (۵ دقیقه اعتبار دارد)."),
      h("div", { class: "lf" }, svgIcon(ICON.lock), code), btn,
      h("div", { class: "row", style: "justify-content:center;margin-top:12px" }, resend, h("button", { type: "button", class: "btn sm ghost", onclick: step1 }, "تغییر کد ملی"))));
  };
  step1();
  return wrap;
}

function renderLogin(app) {
  const panel = h("div");
  const staffB = h("button", { type: "button" }, "ورود کارکنان"), studB = h("button", { type: "button" }, "ورود دانشجو");
  const show = (mode) => {
    staffB.classList.toggle("on", mode === "staff"); studB.classList.toggle("on", mode === "student");
    panel.replaceChildren(mode === "staff" ? staffLoginForm() : studentLoginForm());
  };
  staffB.onclick = () => show("staff"); studB.onclick = () => show("student");
  show("staff");
  app.append(h("div", { class: "login-bg" },
    h("div", { class: "login-card" }, logo(96), h("h1", {}, "ماد"), h("p", { class: "tagline" }, "سامانه‌ی مدیریت اسکان دانشجویی"),
      navigator.onLine ? null : h("div", { class: "login-err" }, "اینترنت قطع است؛ ورود فقط با اتصال به سرور ممکن است."),
      h("div", { class: "lt" }, staffB, studB), panel,
      h("div", { class: "login-foot" }, "کارکنان: کد ملی و رمز عبور · دانشجویان: کد ملی و کد پیامکی", h("br"), "در صورت مشکل در ورود، با سرپرست خوابگاه یا مدیر مربوطه تماس بگیرید"))));
}
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
